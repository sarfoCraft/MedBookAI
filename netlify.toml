[build]
  command = "npm run netlify:build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "@prisma/client", "firebase-admin", "serverless-http"]
  included_files = ["node_modules/.prisma/client/**", "prisma/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
