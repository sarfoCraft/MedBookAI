services:
  postgres:
    image: postgres:16-alpine
    container_name: medbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medbook
      POSTGRES_USER: medbook
      POSTGRES_PASSWORD: medbook_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - medbook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbook -d medbook"]
      interval: 5s
      timeout: 5s
      retries: 15

  medbook:
    build: .
    container_name: medbook-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: postgresql://medbook:medbook_dev_password@postgres:5432/medbook?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      REQUIRE_FIREBASE_AUTH: ${REQUIRE_FIREBASE_AUTH:-false}
      FIREBASE_REQUIRE_EMAIL_VERIFIED: ${FIREBASE_REQUIRE_EMAIL_VERIFIED:-false}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-My Clinic}
      SEED_ORG_TIMEZONE: ${SEED_ORG_TIMEZONE:-Asia/Karachi}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-Clinic Owner}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@example.com}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-30}

volumes:
  medbook_pgdata:
